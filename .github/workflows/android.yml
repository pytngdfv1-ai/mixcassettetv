name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        items: 'platforms;android-34,build-tools;34.0.0'

    - name: Download and Install Gradle 8.1.1
      run: |
        wget -q https://services.gradle.org/distributions/gradle-8.1.1-bin.zip
        unzip -q gradle-8.1.1-bin.zip
        echo "$PWD/gradle-8.1.1/bin" >> $GITHUB_PATH

    - name: Build Debug APK with Gradle
      run: gradle assembleDebug --no-daemon --stacktrace
      env:
        ANDROID_HOME: ${{ steps.setup-android.outputs.android-home }}

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mixcassettetv-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
