name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
        cache: 'gradle'

    - name: Grant execute permission for wrapper and build
      run: |
        # Si no existe gradlew, creamos un comando gradle directo usando gradle nativo si está disponible, o descargamos la versión 8.1.1 oficial compatible
        gradle --version || true

    - name: Build with Gradle Wrapper fallback
      uses: gradle/gradle-build-action@v3
      with:
        arguments: assembleDebug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: mixcassettetv-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        path: app/build/outputs/apk/debug/app-debug.apk
        
